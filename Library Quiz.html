<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Library Quiz</title>
<style>
:root{--bg:#f2f2f7;--card:#fff;--text:#1d1d1f;--mut:#6e6e73;--line:#d2d2d7;--blue:#0071e3;--bs:rgba(0,113,227,.1);--green:#248a3d;--gs:rgba(52,199,89,.16);--red:#d70015;--rs:rgba(255,59,48,.13);--org:#ff9f0a;--trk:#e5e5ea;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--card:#1c1c1e;--text:#f5f5f7;--mut:#98989d;--line:#38383a;--blue:#0a84ff;--bs:rgba(10,132,255,.2);--green:#30d158;--gs:rgba(48,209,88,.18);--red:#ff453a;--rs:rgba(255,69,58,.18);--trk:#2c2c2e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#000;--card:#1c1c1e;--text:#f5f5f7;--mut:#98989d;--line:#38383a;--blue:#0a84ff;--bs:rgba(10,132,255,.2);--green:#30d158;--gs:rgba(48,209,88,.18);--red:#ff453a;--rs:rgba(255,69,58,.18);--trk:#2c2c2e;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI","Noto Sans Devanagari","Kohinoor Devanagari",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.4}
#app{max-width:680px;margin:0 auto;padding:20px 16px 56px}
h1{font-size:34px;letter-spacing:-.02em;margin:8px 0 4px}h2{font-size:21px;line-height:1.4;letter-spacing:-.01em;margin:6px 0 18px}
h3{font-size:13px;color:var(--mut);font-weight:600;margin:26px 12px 8px}
p{margin:0;color:var(--mut)}small{color:var(--mut);font-size:13px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.btn,.btn2{border-radius:980px;padding:13px 24px;font-weight:600;font-size:17px;transition:transform .12s,opacity .2s}
.btn{background:var(--blue);color:#fff}.btn2{background:var(--card);color:var(--blue)}
.btn:active,.btn2:active{transform:scale(.97)}button:disabled{opacity:.35;cursor:not-allowed}
.btn.full{width:100%;margin-top:14px}
.link{color:var(--blue);font-size:17px;padding:6px 4px}
.stats{display:flex;gap:10px;margin-top:18px}.st{flex:1;background:var(--card);border-radius:16px;padding:14px 8px;text-align:center}
.st b{display:block;font-size:26px;letter-spacing:-.01em}.st span{font-size:12px;color:var(--mut)}
.list{background:var(--card);border-radius:16px;overflow:hidden}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;padding:13px 16px;border-bottom:1px solid var(--line);min-height:52px}
.row:last-child{border-bottom:0}.row b{display:block;font-weight:500;font-size:17px}.row i{color:var(--mut);font-style:normal;font-size:22px}
.row .mini{height:4px;background:var(--trk);border-radius:9px;margin-top:6px;width:120px;overflow:hidden}.row .mini u{display:block;height:100%;background:var(--blue)}
.seg{display:flex;background:var(--trk);border-radius:10px;padding:2px;margin:12px 16px}
.seg button{flex:1;padding:7px 0;border-radius:8px;font-size:15px;font-weight:500}.seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.sw{appearance:none;width:51px;height:31px;border-radius:99px;background:var(--trk);position:relative;transition:background .2s;flex:none}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.3);transition:transform .2s}
.sw:checked{background:#34c759}.sw:checked::after{transform:translateX(20px)}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.top span{font-variant-numeric:tabular-nums;font-weight:600}
.prog{height:6px;background:var(--trk);border-radius:9px;overflow:hidden;margin-bottom:18px}.prog i{display:block;height:100%;background:var(--blue);border-radius:9px;transition:width .3s}
.card{background:var(--card);border-radius:22px;padding:22px 20px}
.qh{display:flex;justify-content:space-between;align-items:center}.star{font-size:22px;color:var(--line)}.star.on{color:var(--org)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;font-size:17px;background:var(--bg);border:2px solid transparent;border-radius:14px;padding:14px;transition:all .15s}
.opt:active{transform:scale(.985)}
.tick{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;transition:all .15s}
.tick svg{width:14px;height:14px;opacity:0;transform:scale(.5);transition:all .18s}
.opt.sel{background:var(--bs);border-color:var(--blue)}.opt.sel .tick{background:var(--blue);border-color:var(--blue)}.opt.sel .tick svg{opacity:1;transform:scale(1)}
.opt.ok{background:var(--gs);border-color:var(--green)}.opt.ok .tick{background:var(--green);border-color:var(--green)}.opt.ok .tick svg,.opt.no .tick svg{opacity:1;transform:scale(1)}
.opt.no{background:var(--rs);border-color:var(--red)}.opt.no .tick{background:var(--red);border-color:var(--red)}
.opt.static{cursor:default}.opt.static:active{transform:none}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:20px;gap:10px}
.ring{width:170px;height:170px;margin:4px auto 10px;position:relative}.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring div{position:absolute;inset:0;display:grid;place-items:center;font-size:42px;font-weight:700;letter-spacing:-.02em}
.center{text-align:center}
.rv{background:var(--card);border-radius:18px;padding:18px 16px;margin-top:12px}.rv h4{font-size:17px;margin:0 0 12px;line-height:1.4}
.note{font-size:14px;color:var(--mut);margin-top:10px;white-space:pre-wrap}
.acts{display:flex;gap:6px;margin-top:8px;align-items:center}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center;z-index:9}
.sh{background:var(--card);width:100%;max-width:680px;border-radius:22px 22px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom,0px));max-height:80vh;overflow:auto}
.grab{width:38px;height:5px;background:var(--line);border-radius:9px;margin:0 auto 10px}.sh h3{margin:8px 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:8px}
.g{height:46px;border-radius:12px;background:var(--bg);font-weight:600;position:relative}.g.a{background:var(--blue);color:#fff}.g.c{outline:3px solid var(--text);outline-offset:-3px}
.g.m::after{content:"";position:absolute;top:5px;right:5px;width:8px;height:8px;border-radius:50%;background:var(--org)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

function start(list,label){
  if(!list.length) return;
  run={list,label,ans:{},i:0,t0:Date.now(),neg:cfg.neg,left:cfg.timer?list.length*45:null,f:"all"};
  clearInterval(timerId);

  quiz();
}
function quiz(){

  app.innerHTML=`<div class="top"><button class="link" data-act="exit">End</button><span id="tm">${run.left==null?"":fmt(run.left)}</span><button class="link" data-act="nav">${run.i+1} of ${N} ▾</button></div>

function finish(){
  clearInterval(timerId); const ov=$("#ov"); if(ov) ov.remove(); let c=0,w=0,k=0;

  run.res={c,w,k,sc,p,t}; S.h.unshift({d:Date.now(),l:run.label,c,w,k,p,t}); S.h=S.h.slice(0,40); save(); result();

  <div class="nav"><button class="btn2" data-act="home">Home</button>${r.w+r.k?`<button class="btn" data-act="retry">Retry missed</button>`:""}</div></div>
  <h3>Review</h3><div class="list"><div class="seg">${[["all","All"],["wrong","Wrong"],["skip","Skipped"]].map(f=>`<button data-act="flt" data-v="${f[0]}" class="${run.f===f[0]?"on":""}">${f[1]}</button>`).join("")}</div></div>
  ${items.map(q=>{const a=run.ans[q.id],n=run.list.indexOf(q)+1;
    return `<div class="rv"><h4>${n}. ${esc(q.q)}</h4>${q.o.map((o,i)=>`<div class="opt static ${i===q.a?"ok":i===a?"no":""}" style="margin-top:8px"><span class="tick">${i===q.a||i===a?CHECK:""}</span><span>${esc(o)}</span></div>`).join("")}
    ${a==null?`<p class="note">Skipped</p>`:""}${q.x?`<div class="note">${esc(q.x)}</div>`:""}
    <div class="acts"><button class="star ${S.bm.includes(q.id)?"on":""}" data-act="bm" data-id="${q.id}">★</button><button class="link" data-act="ai" data-id="${q.id}">Explain with Claude</button></div><div class="note" id="ai${q.id}"></div></div>`}).join("")||`<p class="center" style="margin-top:20px">Nothing here.</p>`}`;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{const a=$("#arc"); if(a) a.style.strokeDashoffset=C*(1-r.p/100)}));
  window.scrollTo(0,0);
}
async function explain(id){
  const q=QS.find(x=>x.id==id), el=$("#ai"+id); el.textContent="Thinking…";
  try{const sm=await use("sample"); if(!sm){el.textContent="Explanations are not available here.";return}
    await sm("You are a tutor for the Bihar Librarian LET exam. In simple Hindi (keep English technical terms), explain in 3-4 short sentences why the correct answer is right and why the others are not.\nQuestion: "+q.q+"\nOptions: "+q.o.map((o,i)=>"ABCD"[i]+") "+o).join(" | ")+"\nCorrect: "+"ABCD"[q.a]+"\nBook note: "+q.x,{modelTier:"quick",onText:u=>{el.textContent=u.text}});
  }catch(e){el.textContent="Could not get an explanation. Try again later."}
}
async function exportCsv(){
  const csv="Date,Test,Correct,Wrong,Skipped,Percent,Seconds\n"+S.h.map(h=>[new Date(h.d).toISOString(),'"'+h.l+'"',h.c,h.w,h.k,h.p,h.t].join(",")).join("\n");
  try{const dl=await use("downloads"); if(dl) await dl.save({filename:"quiz-history.csv",data:csv})}catch(e){}
}
function ask(m,yes,l){const el=document.createElement("div");el.className="ov";el.id="ov2";el.innerHTML=`<div class="sh"><div class="grab"></div><h3>${m}</h3><div class="nav"><button class="btn2" data-act="no">Cancel</button><button class="btn" data-act="yes">${l}</button></div></div>`;document.body.appendChild(el);el.querySelector("[data-act=yes]").onclick=()=>{el.remove();yes()}}
const byIds=ids=>QS.filter(q=>ids.includes(q.id));
const ACT={
  set:b=>{const s=SETS.find(x=>x.k==b.dataset.k), l=QS.filter(q=>q.s==s.k); start(cfg.shuf?shuf(l):l,s.t)},
  mix:()=>start(shuf(QS).slice(0,cfg.count),"Mixed · "+cfg.count),
  mis:()=>start(shuf(byIds(Object.keys(S.wr).map(Number))),"My mistakes"),
  bkm:()=>start(byIds(S.bm),"Bookmarked"),
  cnt:b=>{cfg.count=+b.dataset.v;home()},
  pick:b=>{run.ans[run.list[run.i].id]=+b.dataset.i;quiz()},
  prev:()=>{run.i--;quiz()},
  next:()=>{run.i<run.list.length-1?(run.i++,quiz()):sheet()},
  nav:sheet, close:()=>$("#ov").remove(),
  jump:b=>{$("#ov").remove();run.i=+b.dataset.i;quiz()},
  sub:finish,
  exit:()=>ask("End this test without a result?",()=>{clearInterval(timerId);home()},"End test"), no:()=>{const o=$("#ov2");if(o)o.remove()},
  bm:b=>{const id=b.dataset.id?+b.dataset.id:run.list[run.i].id,i=S.bm.indexOf(id); i<0?S.bm.push(id):S.bm.splice(i,1); save(); view==="quiz"?quiz():b.classList.toggle("on")},
  flt:b=>{run.f=b.dataset.v;result()},
  retry:()=>{const l=run.list.filter(q=>run.ans[q.id]!==q.a); start(l,"Retry · "+run.label)},
  home, ai:b=>explain(b.dataset.id), exp:exportCsv,
  clr:()=>ask("Clear your test history?",()=>{S.h=[];save();home()},"Clear")
};
document.addEventListener("click",e=>{const b=e.target.closest("[data-act]"); if(b&&ACT[b.dataset.act]) ACT[b.dataset.act](b)});
document.addEventListener("change",e=>{if(e.target.dataset.cfg) cfg[e.target.dataset.cfg]=e.target.checked});
document.addEventListener("keydown",e=>{if(view!=="quiz"||$("#ov")) return; const k=e.key.toLowerCase(), i="1234abcd".indexOf(k);
  if(i>=0){run.ans[run.list[run.i].id]=i%4;quiz()} else if(k==="arrowright") ACT.next(); else if(k==="arrowleft"&&run.i) ACT.prev()});
init();
</script>
</body>
</html>
